<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>時間あつめゲーム</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    background: linear-gradient(#bfe3f2 0%, #eaf6fb 55%, #eaf6fb 100%);
    font-family: "Hiragino Maru Gothic ProN", "Rounded Mplus 1c", sans-serif;
    touch-action: none;
  }
  #game {
    position: relative;
    width: 100%;
    height: 100vh;
    overflow: hidden;
  }
  .city-layer {
    position: absolute;
    left: 0;
    right: 0;
    pointer-events: none;
    z-index: 0;
  }
  #buildings {
    bottom: 90px;
    height: 42%;
    display: flex;
    align-items: flex-end;
    justify-content: space-around;
  }
  #buildings .bldg {
    width: 11%;
    background: linear-gradient(#8fa6c2, #6f88a8);
    border-radius: 4px 4px 0 0;
    box-shadow: inset -4px 0 0 rgba(0,0,0,0.08);
    position: relative;
  }
  #buildings .bldg::before {
    content: '';
    position: absolute;
    inset: 6px;
    background-image:
      repeating-linear-gradient(to bottom, rgba(255,240,150,0.55) 0 6px, transparent 6px 16px),
      repeating-linear-gradient(to right, rgba(255,240,150,0.55) 0 6px, transparent 6px 16px);
    background-size: 100% 16px, 16px 100%;
    opacity: 0.5;
  }
  #cloud1, #cloud2 {
    top: 8%;
    font-size: 40px;
    opacity: 0.85;
  }
  #cloud1 { left: 8%; }
  #cloud2 { left: 62%; top: 14%; font-size: 30px; }
  #sun {
    top: 6%;
    right: 8%;
    font-size: 46px;
    filter: drop-shadow(0 0 10px rgba(255,210,90,0.6));
  }
  #ground {
    bottom: 0;
    height: 90px;
    background: linear-gradient(#dfe4e8, #c7ced6);
    border-top: 4px dashed #fff9;
  }
  #ground::after {
    content: '';
    position: absolute;
    top: 40px;
    left: 0;
    right: 0;
    height: 6px;
    background: repeating-linear-gradient(to right, #fff 0 30px, transparent 30px 60px);
    opacity: 0.7;
  }
  #hud {
    position: absolute;
    top: 12px;
    left: 0;
    right: 0;
    display: flex;
    justify-content: space-between;
    padding: 0 16px;
    font-size: 22px;
    font-weight: bold;
    color: #6b4a2f;
    z-index: 10;
    text-shadow: 1px 1px 0 #fff;
  }
  #bestLabel {
    position: absolute;
    top: 40px;
    left: 16px;
    font-size: 15px;
    font-weight: bold;
    color: #a4763f;
    z-index: 10;
    text-shadow: 1px 1px 0 #fff;
  }
  .player {
    position: absolute;
    z-index: 5;
    width: 60px;
    height: 60px;
    font-size: 48px;
    line-height: 60px;
    text-align: center;
    user-select: none;
    transition: transform 0.05s;
  }
  .item {
    position: absolute;
    z-index: 5;
    font-size: 34px;
    user-select: none;
  }
  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(255,255,255,0.9);
    text-align: center;
    z-index: 20;
    padding: 20px;
    box-sizing: border-box;
  }
  #overlay h1 {
    font-size: 32px;
    color: #6b4a2f;
    margin-bottom: 10px;
  }
  #overlay p {
    font-size: 18px;
    color: #7a5c40;
    margin: 6px 0;
  }
  #overlay button {
    margin-top: 20px;
    font-size: 22px;
    padding: 12px 32px;
    border: none;
    border-radius: 30px;
    background: #ffb703;
    color: #fff;
    font-weight: bold;
    box-shadow: 0 4px 0 #e08e00;
    cursor: pointer;
  }
  #overlay button:active {
    transform: translateY(3px);
    box-shadow: 0 1px 0 #e08e00;
  }
  #score-big {
    font-size: 30px;
    font-weight: bold;
    color: #ff6b6b;
    margin: 10px 0;
  }
  #best-big {
    font-size: 26px;
    font-weight: bold;
    color: #ffb703;
    margin: 4px 0 10px;
  }
  #newBestBadge {
    font-size: 16px;
    color: #ff6b6b;
    font-weight: bold;
  }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div id="game">
  <div id="sun" class="city-layer">☀️</div>
  <div id="cloud1" class="city-layer">☁️</div>
  <div id="cloud2" class="city-layer">☁️</div>
  <div id="buildings" class="city-layer">
    <div class="bldg" style="height:70%"></div>
    <div class="bldg" style="height:45%"></div>
    <div class="bldg" style="height:85%"></div>
    <div class="bldg" style="height:55%"></div>
    <div class="bldg" style="height:65%"></div>
    <div class="bldg" style="height:40%"></div>
    <div class="bldg" style="height:75%"></div>
  </div>
  <div id="ground" class="city-layer"></div>
  <div id="hud">
    <div id="scoreLabel">⏳ 時間: 0</div>
    <div id="timeLabel">残り: 60</div>
  </div>
  <div id="bestLabel">🏆 最高記録: 0</div>
  <div id="player" class="player">🐣</div>
  <div id="overlay">
    <h1>⏳ 時間あつめゲーム</h1>
    <p>左右にうごいて「⏳」をあつめよう！</p>
    <p>「👹」にはあたらないように！</p>
    <p>矢印キー ← → か、画面タッチでうごかせます</p>
    <button id="startBtn">スタート</button>
  </div>
</div>

<script>
(function () {
  const game = document.getElementById('game');
  const player = document.getElementById('player');
  const overlay = document.getElementById('overlay');
  const startBtn = document.getElementById('startBtn');
  const scoreLabel = document.getElementById('scoreLabel');
  const timeLabel = document.getElementById('timeLabel');
  const bestLabel = document.getElementById('bestLabel');

  const BEST_KEY = 'jikan-atsume-best-score';
  let bestScore = 0;
  try {
    bestScore = parseInt(localStorage.getItem(BEST_KEY), 10) || 0;
  } catch (e) {
    bestScore = 0;
  }

  let gameW, gameH;
  let playerX;
  const playerSize = 60;
  const playerY_ratio = 0.82;
  let playerSpeed = 8;

  let leftHeld = false, rightHeld = false;
  let touchTargetX = null;

  const GAME_LENGTH = 60;
  const EASY_PHASE_SEC = 10;

  let score = 0;
  let timeLeft = GAME_LENGTH;
  let running = false;
  let items = [];
  let spawnTimer = 0;
  let lastTickTime = null;
  let rafId = null;
  let countdownId = null;

  let audioCtx = null;
  let audioUnlocked = false;

  function unlockAudio() {
    if (audioUnlocked) return;
    audioUnlocked = true;
    try {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    } catch (e) {
      audioCtx = null;
    }
  }
  document.addEventListener('touchstart', unlockAudio, { once: true, passive: true });
  document.addEventListener('mousedown', unlockAudio, { once: true });
  document.addEventListener('keydown', unlockAudio, { once: true });

  function playTone(freq, duration, type, startGain) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type || 'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(startGain, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
  }

  function playCollectSound() {
    if (!audioCtx) return;
    playTone(880, 0.12, 'sine', 0.2);
    setTimeout(() => playTone(1320, 0.12, 'sine', 0.15), 60);
  }

  function playHitSound() {
    if (!audioCtx) return;
    playTone(180, 0.35, 'sawtooth', 0.25);
    playTone(90, 0.4, 'square', 0.15);
  }

  function elapsedSec() {
    return GAME_LENGTH - timeLeft;
  }

  // 0 = やさしい, 1 = むずかしさの上限
  function getDifficulty() {
    const t = elapsedSec();
    if (t <= EASY_PHASE_SEC) return 0;
    const rampSec = GAME_LENGTH - EASY_PHASE_SEC;
    return Math.min(1, (t - EASY_PHASE_SEC) / rampSec);
  }

  function currentSpawnInterval() {
    const p = getDifficulty();
    return Math.round(55 - p * 31);
  }

  function currentBadChance() {
    const p = getDifficulty();
    return 0.2 + p * 0.25;
  }

  function currentSpeedBonus() {
    const p = getDifficulty();
    return p * 2.5;
  }

  function resize() {
    gameW = game.clientWidth;
    gameH = game.clientHeight;
    if (playerX === undefined) playerX = gameW / 2 - playerSize / 2;
    playerX = Math.min(Math.max(playerX, 0), gameW - playerSize);
    positionPlayer();
  }
  window.addEventListener('resize', resize);

  function positionPlayer() {
    player.style.left = playerX + 'px';
    player.style.top = (gameH * playerY_ratio) + 'px';
  }

  function resetGame() {
    score = 0;
    timeLeft = GAME_LENGTH;
    items.forEach(it => it.el.remove());
    items = [];
    spawnTimer = 0;
    playerX = gameW / 2 - playerSize / 2;
    positionPlayer();
    updateHUD();
  }

  function updateHUD() {
    scoreLabel.textContent = '⏳ 時間: ' + score;
    timeLabel.textContent = '残り: ' + timeLeft;
    bestLabel.textContent = '🏆 最高記録: ' + bestScore;
  }

  function spawnItem() {
    const isBad = Math.random() < currentBadChance();
    const el = document.createElement('div');
    el.className = 'item';
    el.textContent = isBad ? '👹' : '⏳';
    const size = 34;
    const x = Math.random() * (gameW - size);
    el.style.left = x + 'px';
    el.style.top = '-40px';
    game.appendChild(el);
    items.push({
      el: el,
      x: x,
      y: -40,
      size: size,
      bad: isBad,
      speed: 2 + Math.random() * 1.5 + currentSpeedBonus()
    });
  }

  function rectsOverlap(ax, ay, aw, ah, bx, by, bw, bh) {
    return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
  }

  function update() {
    if (!running) return;

    if (touchTargetX !== null) {
      const diff = touchTargetX - (playerX + playerSize / 2);
      if (Math.abs(diff) > 2) {
        playerX += Math.sign(diff) * Math.min(Math.abs(diff), playerSpeed);
      }
    } else {
      if (leftHeld) playerX -= playerSpeed;
      if (rightHeld) playerX += playerSpeed;
    }
    playerX = Math.min(Math.max(playerX, 0), gameW - playerSize);
    positionPlayer();

    spawnTimer++;
    if (spawnTimer >= currentSpawnInterval()) {
      spawnTimer = 0;
      spawnItem();
    }

    const playerRect = {
      x: playerX + 10,
      y: gameH * playerY_ratio + 10,
      w: playerSize - 20,
      h: playerSize - 20
    };

    for (let i = items.length - 1; i >= 0; i--) {
      const it = items[i];
      it.y += it.speed;
      it.el.style.top = it.y + 'px';

      if (rectsOverlap(playerRect.x, playerRect.y, playerRect.w, playerRect.h,
                        it.x + 4, it.y + 4, it.size - 8, it.size - 8)) {
        if (it.bad) {
          playHitSound();
          endGame();
          return;
        } else {
          score++;
          playCollectSound();
          updateHUD();
        }
        it.el.remove();
        items.splice(i, 1);
        continue;
      }

      if (it.y > gameH + 40) {
        it.el.remove();
        items.splice(i, 1);
      }
    }

    rafId = requestAnimationFrame(update);
  }

  function startCountdown() {
    lastTickTime = Date.now();
    countdownId = setInterval(() => {
      timeLeft--;
      updateHUD();
      if (timeLeft <= 0) {
        endGame();
      }
    }, 1000);
  }

  function startGame() {
    resize();
    resetGame();
    running = true;
    overlay.classList.add('hidden');
    startCountdown();
    rafId = requestAnimationFrame(update);
  }

  function endGame() {
    running = false;
    if (rafId) cancelAnimationFrame(rafId);
    if (countdownId) clearInterval(countdownId);

    const isNewBest = score > bestScore;
    if (isNewBest) {
      bestScore = score;
      try {
        localStorage.setItem(BEST_KEY, String(bestScore));
      } catch (e) {}
    }

    overlay.innerHTML =
      '<h1>⏳ おわり！</h1>' +
      '<p id="score-big">今回の点数: ' + score + ' 点</p>' +
      '<p id="best-big">🏆 最高記録: ' + bestScore + ' 点</p>' +
      (isNewBest ? '<p id="newBestBadge">✨ 新記録！ ✨</p>' : '') +
      '<p>もう一度あそぶ？</p>' +
      '<button id="startBtn2">もういちど</button>';
    overlay.classList.remove('hidden');
    document.getElementById('startBtn2').addEventListener('click', startGame);
  }

  startBtn.addEventListener('click', startGame);

  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowLeft') { leftHeld = true; touchTargetX = null; }
    if (e.key === 'ArrowRight') { rightHeld = true; touchTargetX = null; }
  });
  document.addEventListener('keyup', (e) => {
    if (e.key === 'ArrowLeft') leftHeld = false;
    if (e.key === 'ArrowRight') rightHeld = false;
  });

  function handleTouch(e) {
    if (!running) return;
    const touch = e.touches ? e.touches[0] : e;
    const rect = game.getBoundingClientRect();
    touchTargetX = touch.clientX - rect.left;
  }
  game.addEventListener('touchstart', handleTouch, { passive: true });
  game.addEventListener('touchmove', handleTouch, { passive: true });
  game.addEventListener('touchend', () => { touchTargetX = null; }, { passive: true });

  game.addEventListener('mousedown', (e) => { handleTouch(e); });
  game.addEventListener('mousemove', (e) => { if (e.buttons === 1) handleTouch(e); });
  game.addEventListener('mouseup', () => { touchTargetX = null; });

  resize();
  bestLabel.textContent = '🏆 最高記録: ' + bestScore;
})();
</script>
</body>
</html>
